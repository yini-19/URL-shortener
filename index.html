<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 1.4rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; margin: 16px 0 4px; color: #444; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 20px;
    padding: 16px;
    background: #f0f7f0;
    border-radius: 8px;
    display: none;
  }
  .result.error { background: #fbeaea; }
  .result a { word-break: break-all; color: #0a6b2c; font-weight: 600; }
  .result.error a { color: #b3261e; }
  .stats-link { display: inline-block; margin-top: 8px; font-size: 0.85rem; color: #555; }
</style>
</head>
<body>

<div class="card">
  <h1>Shorten a URL</h1>
  <form id="shorten-form">
    <label for="original_url">Long URL</label>
    <input type="url" id="original_url" required placeholder="https://example.com/some/long/path">

    <label for="creator_email">Your email</label>
    <input type="email" id="creator_email" required placeholder="you@example.com">

    <label for="expires_in_days">Expires in (days) — optional</label>
    <input type="number" id="expires_in_days" min="1" placeholder="e.g. 30">

    <button type="submit" id="submit-btn">Shorten</button>
  </form>

  <div class="result" id="result"></div>
</div>

<script>
  // Change this to your deployed API's base URL (no trailing slash)
  const API_BASE_URL = "https://briefurl-aeje.onrender.com";

  const form = document.getElementById("shorten-form");
  const submitBtn = document.getElementById("submit-btn");
  const result = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const original_url = document.getElementById("original_url").value.trim();
    const creator_email = document.getElementById("creator_email").value.trim();
    const expiresRaw = document.getElementById("expires_in_days").value;

    const payload = { original_url, creator_email };
    if (expiresRaw) {
      payload.expires_in_days = parseInt(expiresRaw, 10);
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Shortening...";
    result.style.display = "none";
    result.classList.remove("error");

    try {
      const response = await fetch(`${API_BASE_URL}/shorten`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await response.json();

      if (!response.ok) {
        const message = Array.isArray(data.detail)
          ? data.detail.map(d => d.msg).join(", ")
          : (data.detail || "Something went wrong.");
        throw new Error(message);
      }

      const code = data.short_url.split("/").pop();

      result.classList.remove("error");
      result.innerHTML = `
        Short link: <a href="${data.short_url}" target="_blank" rel="noopener">${data.short_url}</a>
        <br>
        <a class="stats-link" href="${API_BASE_URL}/stats/${code}" target="_blank" rel="noopener">View stats →</a>
      `;
      result.style.display = "block";
    } catch (err) {
      result.classList.add("error");
      result.textContent = err.message;
      result.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Shorten";
    }
  });
</script>

</body>
</html>
